[package]
name = "dissimulation"
version = "0.7.0"
description = "Visualiser l'exposition réseau d'une machine Ubuntu"
authors = ["Dissimulation contributors"]
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "dissimulation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dissimulation-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
